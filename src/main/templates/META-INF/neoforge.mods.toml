modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Earth Platform provides the Earth world players spawn into. Without it the mod
# falls back to the overworld and its own Web Mercator math.
[[dependencies.${mod_id}]]
    modId="earthplatform"
    type="optional"
    versionRange="*"
    ordering="AFTER"
    side="BOTH"
